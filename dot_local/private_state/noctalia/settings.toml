[osd]
position = "top_right"

[shell]
avatar_path = "/home/anish/Pictures/Wallpapers/larch.png"
font_family = "Adwaita Sans"
screen_time_enabled = true

    [shell.launcher]
    pinned = [ "google-chrome", "code", "kitty" ]

    [shell.panel]
    open_near_click_control_center = true
    transparency_mode = "glass"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 5.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 5.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 5.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 5.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 5.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[theme]
builtin = "Catppuccin"
community_palette = "Aura"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "kcolorscheme", "kitty" ]

[wallpaper]
directory = "/home/anish/Pictures/Wallpapers"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/anish/Pictures/Wallpapers/pexels-kaboompics-6406.jpg"

    [wallpaper.last]
    path = "/home/anish/Pictures/Wallpapers/pexels-kaboompics-6406.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/anish/Pictures/Wallpapers/pexels-kaboompics-6406.jpg"

[widget.battery]
hide_when_full = true

[widget.clock]
format = "{:%-I:%M %p}"

[widget.media]
hide_when_no_media = true
max_length = 100

[widget.network]
show_label = false

[widget.notifications]
hide_when_no_unread = true

[widget.taskbar]
anchor = true
capsule = true
capsule_opacity = 0.0
capsule_padding = 8
group_by_workspace = true
inactive_opacity = 0.80000000000000004
minimal = true
workspace_label_placement = "inside"

[widget.workspaces]
show_all_outputs = true