config_version = 13

[bar.default]
border = "primary"
border_width = 0.5
capsule = true
center = [ "workspaces", "clock" ]
end = [ "tray", "notifications", "network", "bluetooth", "volume", "battery", "control-center" ]
margin_edge = 1
margin_ends = 350
start = [ "cpu", "ram", "temp", "media" ]

[control_center]
sidebar = "full"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
auto_hide = true
layer = "overlay"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[osd]
position = "top_right"

[shell]
niri_overview_type_to_launch_enabled = true

    [shell.launcher]
    pinned = [ "google-chrome", "org.kde.konsole", "code" ]

    [shell.panel]
    open_near_click_control_center = true

[theme]
builtin = "Catppuccin"
community_palette = "Doomed"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/anish/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/anish/Pictures/Wallpapers/pexels-kaboompics-6406.jpg"

    [wallpaper.last]
    path = "/home/anish/Pictures/Wallpapers/pexels-kaboompics-6406.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/anish/Pictures/Wallpapers/pexels-kaboompics-6406.jpg"

[widget.workspaces]
show_all_outputs = true